#!/bin/bash
#
# Title:      rTorrent + ruTorrent behind a Gluetun VPN (kill switch)
# Author(s):  qdm12 (gluetun), crazy-max (rtorrent-rutorrent)
# URL:        https://github.com/qdm12/gluetun - https://github.com/crazy-max/docker-rtorrent-rutorrent
# GNU:        General Public License v3.0
################################################################################
---
- hosts: localhost
  gather_facts: false
  tasks:
    # FACTS #######################################################################

    # {{pgrole}} is the gluetun container: it owns the network, ports and Traefik
    # labels. rTorrent runs in {{client}} and shares gluetun's network stack, so
    # its traffic can only leave through the VPN tunnel.
    - name: 'Set Known Facts'
      set_fact:
        pgrole: 'rutorrent-vpn'
        client: 'rutorrent-vpn-client'
        intport: '8080'
        extport: '5897'
        image: 'qmcgaw/gluetun:latest'
        client_image: 'crazymax/rtorrent-rutorrent:latest'

    # VPN CREDENTIALS #############################################################
    # Kept outside the repo in a root-only file, filled in by hand once per server
    - name: 'Checking for {{pgrole}} VPN credentials'
      stat:
        path: '/var/plexguide/{{pgrole}}.env'
      register: envcheck

    - name: 'Creating {{pgrole}} VPN credentials template'
      shell: |
        umask 077
        cat > /var/plexguide/{{pgrole}}.env <<'EOF'
        OPENVPN_USER=your-pia-username
        OPENVPN_PASSWORD=your-pia-password
        SERVER_REGIONS=AU Perth
        EOF
      when: not envcheck.stat.exists

    - name: 'Checking {{pgrole}} VPN credentials are filled in'
      shell: 'grep -q "your-pia-" /var/plexguide/{{pgrole}}.env'
      register: envtemplate
      failed_when: false
      changed_when: false

    - name: 'Stopping - VPN credentials needed'
      fail:
        msg: 'Edit /var/plexguide/{{pgrole}}.env with your PIA username, password and region, then deploy again.'
      when: envtemplate.rc == 0

    # CORE (MANDATORY) ############################################################
    - name: 'Including cron job'
      include_tasks: '/opt/communityapps/apps/_core.yml'

    - name: 'Including plugins'
      include_tasks: '/opt/communityapps/apps/_plugins.yml'

    - name: 'Including folders'
      include_tasks: '/opt/communityapps/apps/_downloaders.yml'

    - name: 'Creating {{pgrole}} config folders'
      file: 'path={{item}} state=directory mode=0775 owner=1000 group=1000'
      with_items:
        - '/opt/appdata/{{pgrole}}/gluetun'
        - '/opt/appdata/{{pgrole}}/data'
        - '/opt/appdata/{{pgrole}}/passwd'

    # Not under /opt/appdata: _core.yml makes that world-readable on every deploy
    - name: 'Creating {{pgrole}} MyAnonamouse cookie folder (root-only)'
      file: 'path=/var/plexguide/{{pgrole}}-mam state=directory mode=0700 owner=root group=root'

    # PIA hands out a new forwarded port on each connection; gluetun runs this
    # with the port and it moves rTorrent's listener over via XMLRPC. The VPN IP
    # usually changes at the same time, so it also updates MyAnonamouse's
    # dynamic seedbox IP when MAM_ID is set in the env file
    - name: 'Installing {{pgrole}} port forwarding hook'
      copy:
        dest: '/opt/appdata/{{pgrole}}/gluetun/port-forward.sh'
        mode: '0755'
        content: |
          #!/bin/sh
          port="$1"
          rpc() {
            wget -qO- --header 'Content-Type: text/xml' \
              --post-data "<?xml version=\"1.0\"?><methodCall><methodName>$1</methodName><params><param><value><string></string></value></param><param><value>$2</value></param></params></methodCall>" \
              http://127.0.0.1:8010/RPC2
          }
          set_port() {
            # rTorrent may still be starting, e.g. after a reboot
            for i in $(seq 1 30); do
              if rpc network.listen.port.range.set "<string>$port-$port</string>" >/dev/null &&
                rpc network.listen.port.set "<i8>$port</i8>" >/dev/null; then
                echo "rTorrent now listening on $port"
                return 0
              fi
              sleep 5
            done
            echo "rTorrent did not answer, port $port not applied"
            return 1
          }
          set_port
          status=$?

          # MAM sends back a refreshed mam_id cookie, so after the first call the
          # saved cookie is used instead of the one from the env file
          mam="${MAM_ID:-$mam_id}"
          jar=/mam/cookies.txt
          url=https://t.myanonamouse.net/json/dynamicSeedbox.php
          mam_with_env() {
            wget -qO- -T 15 --content-on-error --header "Cookie: mam_id=$mam" \
              --save-cookies "$jar" --keep-session-cookies "$url"
          }
          mam_with_jar() {
            wget -qO- -T 15 --content-on-error --load-cookies "$jar" \
              --save-cookies "$jar" --keep-session-cookies "$url"
          }
          if [ -n "$mam" ]; then
            umask 077
            if grep -q mam_id "$jar" 2>/dev/null; then
              reply=$(mam_with_jar)
              # saved cookie gone stale, e.g. a new session was put in the env file
              case "$reply" in *"Invalid session"*) reply=$(mam_with_env) ;; esac
            else
              reply=$(mam_with_env)
            fi
            echo "MyAnonamouse seedbox IP: $reply"
          fi
          exit $status

    # LABELS ######################################################################
    - name: 'Adding Traefik'
      set_fact:
        pg_labels:
          traefik.enable: 'true'
          traefik.port: '{{intport}}'
          traefik.frontend.auth.forward.address: '{{gauth}}'
          traefik.frontend.rule: 'Host:{{pgrole}}.{{domain.stdout}}{{tldset}}{{cname}}'
          traefik.frontend.headers.SSLHost: '{{domain.stdout}}'
          traefik.frontend.headers.SSLRedirect: 'true'
          traefik.frontend.headers.STSIncludeSubdomains: 'true'
          traefik.frontend.headers.STSPreload: 'true'
          traefik.frontend.headers.STSSeconds: '315360000'
          traefik.frontend.headers.browserXSSFilter: 'true'
          traefik.frontend.headers.contentTypeNosniff: 'true'
          traefik.frontend.headers.customResponseHeaders: 'X-Robots-Tag:noindex,nofollow,nosnippet,noarchive,notranslate,noimageindex'
          traefik.frontend.headers.forceSTSHeader: 'true'

    - name: 'Setting {{pgrole}} ENV'
      set_fact:
        pg_env:
          VPN_SERVICE_PROVIDER: 'private internet access'
          # the built-in server list goes stale; refresh it from PIA daily
          UPDATER_PERIOD: '24h'
          VPN_PORT_FORWARDING: 'on'
          PORT_FORWARD_ONLY: 'true'
          # !unsafe: {{PORT}} is gluetun's placeholder, not an Ansible variable
          VPN_PORT_FORWARDING_UP_COMMAND: !unsafe '/bin/sh /gluetun/port-forward.sh {{PORT}}'
          TZ: 'Australia/Perth'

    - name: 'Setting {{client}} ENV'
      set_fact:
        client_env:
          PUID: '1000'
          PGID: '1000'
          TZ: 'Australia/Perth'
          # gluetun's control server already listens on 8000
          XMLRPC_PORT: '8010'
          RUTORRENT_PORT: '{{intport}}'

    # MAIN DEPLOYMENT #############################################################
    - name: 'Removing {{client}}'
      docker_container:
        name: '{{client}}'
        state: absent
      ignore_errors: True

    - name: 'Deploying {{pgrole}}'
      docker_container:
        name: '{{pgrole}}'
        image: '{{image}}'
        pull: yes
        published_ports:
          - '{{ports.stdout}}{{extport}}:{{intport}}'
        volumes:
          - '/opt/appdata/{{pgrole}}/gluetun:/gluetun'
          - '/var/plexguide/{{pgrole}}-mam:/mam'
        env: '{{pg_env}}'
        env_file: '/var/plexguide/{{pgrole}}.env'
        capabilities:
          - NET_ADMIN
        devices:
          - '/dev/net/tun:/dev/net/tun'
        restart_policy: unless-stopped
        networks:
          - name: plexguide
            aliases:
              - '{{pgrole}}'
        state: started
        labels: '{{pg_labels}}'

    - name: 'Deploying {{client}}'
      docker_container:
        name: '{{client}}'
        image: '{{client_image}}'
        pull: yes
        network_mode: 'container:{{pgrole}}'
        volumes:
          - '/etc/localtime:/etc/localtime:ro'
          - '/opt/appdata/{{pgrole}}/data:/data'
          - '/opt/appdata/{{pgrole}}/passwd:/passwd'
          - '{{path.stdout}}/downloads/{{pgrole}}:/downloads'
        env: '{{client_env}}'
        restart_policy: unless-stopped
        state: started
