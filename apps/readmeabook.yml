#!/bin/bash
#
# Title:      ReadMeABook (RMAB) - audiobook requests and downloads
# Author(s):  kikootwo
# URL:        https://github.com/kikootwo/ReadMeABook
# GNU:        AGPL-3.0
################################################################################
---
- hosts: localhost
  gather_facts: false
  tasks:
    # FACTS #######################################################################
    - name: 'Set Known Facts'
      set_fact:
        pgrole: 'readmeabook'
        intport: '3030'
        extport: '3030'
        # Pinned: the image runs its own PostgreSQL and migrates it on start.
        # Upgrade by editing this after a backup.
        image: 'ghcr.io/kikootwo/readmeabook:1.3.0'

    # CORE (MANDATORY) ############################################################
    - name: 'Including cron job'
      include_tasks: '/opt/communityapps/apps/_core.yml'

    # The bundled PostgreSQL keeps its own owner (uid 102) and refuses to start
    # on a group/world-readable data folder. _core.yml runs chown -R 1000 and
    # chmod -R 775 on /opt/appdata/{{pgrole}} on every deploy, so the database
    # and Redis live outside it.
    - name: 'Creating {{pgrole}} database folders (outside /opt/appdata)'
      file: 'path={{item}} state=directory'
      with_items:
        - '/var/plexguide/{{pgrole}}-pgdata'
        - '/var/plexguide/{{pgrole}}-redis'

    # LABELS ######################################################################
    - name: 'Adding Traefik'
      set_fact:
        pg_labels:
          traefik.enable: 'true'
          traefik.port: '{{intport}}'
          traefik.frontend.auth.forward.address: '{{gauth}}'
          traefik.frontend.rule: 'Host:{{pgrole}}.{{domain.stdout}}{{tldset}}{{cname}}'
          traefik.frontend.headers.SSLHost: '{{domain.stdout}}'
          traefik.frontend.headers.SSLRedirect: 'true'
          traefik.frontend.headers.STSIncludeSubdomains: 'true'
          traefik.frontend.headers.STSPreload: 'true'
          traefik.frontend.headers.STSSeconds: '315360000'
          traefik.frontend.headers.browserXSSFilter: 'true'
          traefik.frontend.headers.contentTypeNosniff: 'true'
          traefik.frontend.headers.customResponseHeaders: 'X-Robots-Tag:noindex,nofollow,nosnippet,noarchive,notranslate,noimageindex'
          traefik.frontend.headers.forceSTSHeader: 'true'

    # /mnt is mounted at the same path as in nzbget and audiobookshelf, so the
    # download and library folders are entered in the UI as /mnt/... paths
    - name: 'Setting {{pgrole}} Volumes'
      set_fact:
        pg_volumes:
          - '/etc/localtime:/etc/localtime:ro'
          - '/opt/appdata/{{pgrole}}/config:/app/config'
          - '/opt/appdata/{{pgrole}}/cache:/app/cache'
          - '/var/plexguide/{{pgrole}}-pgdata:/var/lib/postgresql/data'
          - '/var/plexguide/{{pgrole}}-redis:/var/lib/redis'
          - '{{path.stdout}}:{{path.stdout}}'

    - name: 'Setting {{pgrole}} ENV'
      set_fact:
        pg_env:
          PUID: '1000'
          PGID: '1000'
          TZ: 'Australia/Perth'
          PUBLIC_URL: 'https://{{pgrole}}.{{domain.stdout}}'

    # MAIN DEPLOYMENT #############################################################
    - name: 'Deploying {{pgrole}}'
      docker_container:
        name: '{{pgrole}}'
        image: '{{image}}'
        pull: yes
        published_ports:
          - '{{ports.stdout}}{{extport}}:{{intport}}'
        volumes: '{{pg_volumes}}'
        env: '{{pg_env}}'
        # time for supervisord to stop the app, Redis and PostgreSQL in turn
        stop_timeout: 90
        healthcheck:
          test: ['CMD', 'curl', '-f', 'http://localhost:3030/api/health']
          interval: 30s
          timeout: 10s
          retries: 3
          start_period: 60s
        restart_policy: unless-stopped
        networks:
          - name: plexguide
            aliases:
              - '{{pgrole}}'
        state: started
        labels: '{{pg_labels}}'
